<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>migrain</title>
    <style>
        :root, body[data-palette="github-dark"] {
            --bg: #0d1117;
            --surface: #161b22;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --outline: #30363d;
            --accent: #58a6ff;
            --record: #ff7b72;
        }

        body[data-palette="github-light"] {
            --bg: #ffffff;
            --surface: #f6f8fa;
            --text: #24292f;
            --text-secondary: #57606a;
            --outline: #d0d7de;
            --accent: #0969da;
            --record: #cf222e;
        }

        body[data-palette="dracula-dark"] {
            --bg: #282a36;
            --surface: #44475a;
            --text: #f8f8f2;
            --text-secondary: #6272a4;
            --outline: #6272a4;
            --accent: #bd93f9;
            --record: #ff5555;
        }

        body[data-palette="catppuccin-mocha"] {
            --bg: #1e1e2e;
            --surface: #313244;
            --text: #cdd6f4;
            --text-secondary: #a6adc8;
            --outline: #585b70;
            --accent: #cba6f7;
            --record: #f38ba8;
        }

        body[data-palette="catppuccin-macchiato"] {
            --bg: #24273a;
            --surface: #363a4f;
            --text: #cad3f5;
            --text-secondary: #a5adcb;
            --outline: #5b6078;
            --accent: #c6a0f6;
            --record: #ed8796;
        }

        body[data-palette="catppuccin-frappe"] {
            --bg: #303446;
            --surface: #414559;
            --text: #c6d0f5;
            --text-secondary: #a5adce;
            --outline: #626880;
            --accent: #ca9ee6;
            --record: #e78284;
        }

        body[data-palette="catppuccin-latte"] {
            --bg: #eff1f5;
            --surface: #e6e9ef;
            --text: #4c4f69;
            --text-secondary: #6c6f85;
            --outline: #bcc0cc;
            --accent: #8839ef;
            --record: #d20f39;
        }

        body[data-palette="everforest-dark"] {
            --bg: #2b3339;
            --surface: #323c41;
            --text: #d3c6aa;
            --text-secondary: #9da9a0;
            --outline: #4a555b;
            --accent: #a7c080;
            --record: #e67e80;
        }

        body[data-palette="everforest-light"] {
            --bg: #fdf6e3;
            --surface: #f4f0d9;
            --text: #5c6a72;
            --text-secondary: #829181;
            --outline: #dfddc8;
            --accent: #8da101;
            --record: #f85552;
        }

        body[data-palette="nord"] {
            --bg: #2e3440;
            --surface: #3b4252;
            --text: #eceff4;
            --text-secondary: #d8dee9;
            --outline: #4c566a;
            --accent: #88c0d0;
            --record: #bf616a;
        }

        body[data-palette="gruvbox-dark"] {
            --bg: #282828;
            --surface: #3c3836;
            --text: #ebdbb2;
            --text-secondary: #a89984;
            --outline: #504945;
            --accent: #fe8019;
            --record: #fb4934;
        }

        body[data-palette="gruvbox-light"] {
            --bg: #fbf1c7;
            --surface: #ebdbb2;
            --text: #3c3836;
            --text-secondary: #7c6f64;
            --outline: #d5c4a1;
            --accent: #af3a03;
            --record: #9d0006;
        }

        body[data-palette="one-dark"] {
            --bg: #282c34;
            --surface: #21252b;
            --text: #abb2bf;
            --text-secondary: #5c6370;
            --outline: #3e4451;
            --accent: #61afef;
            --record: #e06c75;
        }

        body[data-palette="monokai"] {
            --bg: #272822;
            --surface: #3e3d32;
            --text: #f8f8f2;
            --text-secondary: #75715e;
            --outline: #49483e;
            --accent: #a6e22e;
            --record: #f92672;
        }

        body[data-palette="tokyo-night"] {
            --bg: #1a1b26;
            --surface: #24283b;
            --text: #a9b1d6;
            --text-secondary: #565f89;
            --outline: #414868;
            --accent: #7aa2f7;
            --record: #f7768e;
        }

        body[data-palette="rose-pine"] {
            --bg: #191724;
            --surface: #1f1d2e;
            --text: #e0def4;
            --text-secondary: #908caa;
            --outline: #26233a;
            --accent: #c4a7e7;
            --record: #eb6f92;
        }

        body[data-palette="solarized-dark"] {
            --bg: #002b36;
            --surface: #073642;
            --text: #839496;
            --text-secondary: #657b83;
            --outline: #586e75;
            --accent: #2aa198;
            --record: #dc322f;
        }

        body[data-palette="solarized-light"] {
            --bg: #fdf6e3;
            --surface: #eee8d5;
            --text: #657b83;
            --text-secondary: #839496;
            --outline: #93a1a1;
            --accent: #268bd2;
            --record: #dc322f;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            touch-action: none;
            transition: background-color .3s, color .3s;
        }

        #main-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            gap: 15px;
        }

        .draggable-section {
            width: 95%;
            max-width: 600px;
            position: relative;
            transition: transform 0.2s ease-out;
        }

        .draggable-section.is-dragging {
            z-index: 1000;
            transition: none;
        }

        .placeholder {
            background: transparent;
        }

        .drag-handle {
            position: absolute;
            background-color: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 8px;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 24px;
            line-height: 10px;
            cursor: grab;
            z-index: 110;
            touch-action: none;
            user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        #canvas-container {
            border: 1px solid var(--outline);
            border-radius: 8px;
            background-color: var(--surface);
            flex-shrink: 0;
        }

        .container-wrapper {
            flex-grow: 1;
            min-height: 0;
            position: relative;
        }

        .container {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 35px;
            border: 1px solid var(--outline);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
            overflow-y: auto;
            transition: background-color .3s, border-color .3s;
            scrollbar-width: none;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        #custom-scrollbar {
            position: absolute;
            top: 10px;
            bottom: 10px;
            right: 5px;
            width: 15px;
        }

        #scrollbar-thumb {
            width: 100%;
            background-color: var(--accent);
            border-radius: 4px;
            position: relative;
            cursor: grab;
        }

        #scrollbar-thumb:active {
            cursor: grabbing;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .effect-group h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 0;
        }

        .effect-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        #canvas-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        #waveform-canvas {
            width: 100%;
            height: 120px;
            background-color: var(--bg);
            cursor: crosshair;
            display: block;
        }

        .crop-overlay {
            position: absolute;
            top: 0;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        #crop-overlay-start {
            left: 0;
            width: 0;
        }

        #crop-overlay-end {
            right: 0;
            width: 0;
        }

        #play-indicator-v,
        #play-indicator-h {
            position: absolute;
            background-color: var(--record);
            pointer-events: none;
            opacity: 0;
        }

        #play-indicator-v {
            width: 2px;
            height: 120px;
            top: 0;
        }

        #play-indicator-h {
            height: 2px;
            width: 100%;
            left: 0;
        }

        #instructions {
            text-align: center;
            color: var(--text-secondary);
            min-height: 1.2em;
            font-size: .9rem;
            margin: 0;
            padding: 5px;
            border-top: 1px solid var(--outline);
            border-radius: 0 0 8px 8px;
        }

        .effect-controls {
            display: grid;
            gap: 20px 15px;
            padding-top: 10px;
            border-top: 1px solid var(--outline);
            margin-top: 10px;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            justify-items: center;
        }

        .palette-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--outline);
            margin-top: 10px;
            justify-items: center;
        }

        .palette-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--outline);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            padding: 0;
            outline: none;
        }

        .palette-btn:hover,
        .palette-btn.active {
            transform: scale(1.15);
            border-color: var(--accent);
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .control label {
            font-size: .8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .knob-container {
            position: relative;
            width: 50px;
            height: 50px;
            cursor: ew-resize;
        }

        .knob-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(135deg);
        }

        .knob-track,
        .knob-fill {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
        }

        .knob-track {
            stroke: var(--outline);
        }

        .knob-fill {
            stroke: var(--accent);
        }

        .square-slider-container {
            width: 40px;
            height: 24px;
            background-color: var(--outline);
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
        }

        .square-slider-fill {
            background-color: var(--accent);
            width: 100%;
            height: 100%;
            transform-origin: left;
            transform: scaleX(0);
        }

        .square-slider-container[data-checked=true] .square-slider-fill {
            transform: scaleX(1);
        }

        .bottom-controls {
            flex-shrink: 0;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 15px;
            background-color: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 12px;
        }

        button,
        .file-upload-wrapper label,
        a#github-btn {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--outline);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 500;
            transition: background-color .2s, border-color .2s;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        #github-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .file-upload-wrapper {
            display: flex;
        }

        button:hover,
        .file-upload-wrapper label:hover,
        a#github-btn:hover {
            background-color: var(--outline);
        }

        #record-btn.recording,
        #autoplay-btn.playing {
            background-color: var(--record);
            color: var(--bg);
            border-color: var(--record);
        }

        input[type=file] {
            display: none;
        }

        .autoplay-controls {
            grid-column: 1 / -1;
            display: contents;
        }
    </style>
</head>

<body data-palette="github-dark">
    <div id="main-content">
        <div id="canvas-container" class="draggable-section">
            <div class="drag-handle">𑁋</div>
            <div id="canvas-wrapper">
                <canvas id="waveform-canvas"></canvas>
                <div id="crop-overlay-start" class="crop-overlay"></div>
                <div id="crop-overlay-end" class="crop-overlay"></div>
                <div id="play-indicator-v"></div>
                <div id="play-indicator-h"></div>
            </div>
            <p id="instructions">Upload an audio file to begin.</p>
        </div>
        <div class="container-wrapper draggable-section" id="container-wrapper">
            <div class="drag-handle">𑁋</div>
            <div class="container">
                <div class="header">
                    <h1>migrain</h1>
                    <div class="square-slider-container" data-id="theme-toggle" data-checked="false" data-default-checked="false">
                        <div class="square-slider-fill"></div>
                    </div>
                </div>

                <div class="effect-group" id="palette-menu" style="display: none;">
                    <div class="effect-header">
                        <h2>Palette</h2>
                    </div>
                    <div class="palette-options">
                        <button class="palette-btn active" data-palette="github-dark" title="GitHub Dark" style="background: conic-gradient(#0d1117 0 25%, #161b22 25% 50%, #58a6ff 50% 75%, #c9d1d9 75% 100%)"></button>
                        <button class="palette-btn" data-palette="github-light" title="GitHub Light" style="background: conic-gradient(#ffffff 0 25%, #f6f8fa 25% 50%, #0969da 50% 75%, #24292f 75% 100%)"></button>
                        <button class="palette-btn" data-palette="dracula-dark" title="Dracula Dark" style="background: conic-gradient(#282a36 0 25%, #44475a 25% 50%, #bd93f9 50% 75%, #f8f8f2 75% 100%)"></button>
                        <button class="palette-btn" data-palette="catppuccin-mocha" title="Catppuccin Mocha" style="background: conic-gradient(#1e1e2e 0 25%, #313244 25% 50%, #cba6f7 50% 75%, #cdd6f4 75% 100%)"></button>
                        <button class="palette-btn" data-palette="catppuccin-macchiato" title="Catppuccin Macchiato" style="background: conic-gradient(#24273a 0 25%, #363a4f 25% 50%, #c6a0f6 50% 75%, #cad3f5 75% 100%)"></button>
                        <button class="palette-btn" data-palette="catppuccin-frappe" title="Catppuccin Frappe" style="background: conic-gradient(#303446 0 25%, #414559 25% 50%, #ca9ee6 50% 75%, #c6d0f5 75% 100%)"></button>
                        <button class="palette-btn" data-palette="catppuccin-latte" title="Catppuccin Latte" style="background: conic-gradient(#eff1f5 0 25%, #e6e9ef 25% 50%, #8839ef 50% 75%, #4c4f69 75% 100%)"></button>
                        <button class="palette-btn" data-palette="everforest-dark" title="Everforest Dark" style="background: conic-gradient(#2b3339 0 25%, #323c41 25% 50%, #a7c080 50% 75%, #d3c6aa 75% 100%)"></button>
                        <button class="palette-btn" data-palette="everforest-light" title="Everforest Light" style="background: conic-gradient(#fdf6e3 0 25%, #f4f0d9 25% 50%, #8da101 50% 75%, #5c6a72 75% 100%)"></button>
                        <button class="palette-btn" data-palette="nord" title="Nord" style="background: conic-gradient(#2e3440 0 25%, #3b4252 25% 50%, #88c0d0 50% 75%, #eceff4 75% 100%)"></button>
                        <button class="palette-btn" data-palette="gruvbox-dark" title="Gruvbox Dark" style="background: conic-gradient(#282828 0 25%, #3c3836 25% 50%, #fe8019 50% 75%, #ebdbb2 75% 100%)"></button>
                        <button class="palette-btn" data-palette="gruvbox-light" title="Gruvbox Light" style="background: conic-gradient(#fbf1c7 0 25%, #ebdbb2 25% 50%, #af3a03 50% 75%, #3c3836 75% 100%)"></button>
                        <button class="palette-btn" data-palette="one-dark" title="One Dark Pro" style="background: conic-gradient(#282c34 0 25%, #21252b 25% 50%, #61afef 50% 75%, #abb2bf 75% 100%)"></button>
                        <button class="palette-btn" data-palette="monokai" title="Monokai" style="background: conic-gradient(#272822 0 25%, #3e3d32 25% 50%, #a6e22e 50% 75%, #f8f8f2 75% 100%)"></button>
                        <button class="palette-btn" data-palette="tokyo-night" title="Tokyo Night" style="background: conic-gradient(#1a1b26 0 25%, #24283b 25% 50%, #7aa2f7 50% 75%, #a9b1d6 75% 100%)"></button>
                        <button class="palette-btn" data-palette="rose-pine" title="Rosé Pine" style="background: conic-gradient(#191724 0 25%, #1f1d2e 25% 50%, #c4a7e7 50% 75%, #e0def4 75% 100%)"></button>
                        <button class="palette-btn" data-palette="solarized-dark" title="Solarized Dark" style="background: conic-gradient(#002b36 0 25%, #073642 25% 50%, #2aa198 50% 75%, #839496 75% 100%)"></button>
                        <button class="palette-btn" data-palette="solarized-light" title="Solarized Light" style="background: conic-gradient(#fdf6e3 0 25%, #eee8d5 25% 50%, #268bd2 50% 75%, #657b83 75% 100%)"></button>
                    </div>
                </div>

                <div class="effect-group" data-effect="input">
                    <div class="effect-header">
                        <h2>Input</h2>
                        <div class="square-slider-container group-toggle" data-checked="true" data-default-checked="true">
                            <div class="square-slider-fill"></div>
                        </div>
                    </div>
                    <div class="effect-controls">
                        <div class="control">
                            <label>Input Gain</label>
                            <div class="knob-container" data-id="input-gain" data-min="0.1" data-max="10" data-value="1" data-step="0.01"></div>
                        </div>
                        <div class="control">
                            <label>Filter Type</label>
                            <div class="knob-container" data-id="preview-filter-type" data-min="0" data-max="7" data-value="0" data-step="1"></div>
                        </div>
                        <div class="control">
                            <label>Filter Q</label>
                            <div class="knob-container" data-id="preview-filter-q" data-min="0.0001" data-max="30" data-value="1" data-step="0.01"></div>
                        </div>
                        <div class="control">
                            <label>Attack</label>
                            <div class="knob-container" data-id="env-attack" data-min="0.001" data-max="5" data-value="0.01" data-step="0.001"></div>
                        </div>
                        <div class="control">
                            <label>Decay</label>
                            <div class="knob-container" data-id="env-decay" data-min="0.001" data-max="5" data-value="0.1" data-step="0.001"></div>
                        </div>
                        <div class="control">
                            <label>Sustain</label>
                            <div class="knob-container" data-id="env-sustain" data-min="0" data-max="1" data-value="1" data-step="0.01"></div>
                        </div>
                        <div class="control">
                            <label>Release</label>
                            <div class="knob-container" data-id="env-release" data-min="0.001" data-max="5" data-value="0.1" data-step="0.001"></div>
                        </div>
                        <div class="autoplay-controls">
                            <div class="control" style="grid-column: 1 / -1; width: 100%;">
                                <button id="autoplay-btn">Autoplay</button>
                            </div>
                            <div class="control">
                                <label>Crop Start</label>
                                <div class="knob-container" data-id="autoplay-crop-start" data-min="0" data-max="1" data-value="0" data-step="0.001"></div>
                            </div>
                            <div class="control">
                                <label>Crop End</label>
                                <div class="knob-container" data-id="autoplay-crop-end" data-min="0" data-max="1" data-value="1" data-step="0.001"></div>
                            </div>
                            <div class="control">
                                <label>Speed</label>
                                <div class="knob-container" data-id="autoplay-speed" data-min="0.1" data-max="10" data-value="1" data-step="0.01"></div>
                            </div>
                            <div class="control">
                                <label>Vertical Pos</label>
                                <div class="knob-container" data-id="autoplay-vertical-pos" data-min="0" data-max="1" data-value="0.5" data-step="0.01"></div>
                            </div>
                            <div class="control">
                                <label>Direction</label>
                                <div class="square-slider-container" data-id="autoplay-direction" data-checked="false" data-default-checked="false">
                                    <div class="square-slider-fill"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="effect-group" data-effect="granular">
                    <div class="effect-header">
                        <h2>Granular</h2>
                        <div class="square-slider-container group-toggle" data-checked="true" data-default-checked="true">
                            <div class="square-slider-fill"></div>
                        </div>
                    </div>
                    <div class="effect-controls">
                        <div class="control">
                            <label>Size</label>
                            <div class="knob-container" data-id="grain-size" data-min="10" data-max="500" data-value="100"></div>
                        </div>
                        <div class="control">
                            <label>Density</label>
                            <div class="knob-container" data-id="grain-density" data-min="1" data-max="100" data-value="20"></div>
                        </div>
                        <div class="control">
                            <label>Pitch</label>
                            <div class="knob-container" data-id="pitch" data-min="0.1" data-max="4.0" data-value="1.0" data-step="0.01"></div>
                        </div>
                        <div class="control">
