<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>migrain</title>
    <style>
        :root {
            --light-bg: #ffffff;
            --light-surface: #f1f3f4;
            --light-text: #202124;
            --light-text-secondary: #5f6368;
            --light-outline: #dadce0;
            --light-accent: #1a73e8;
            --light-record: #d93025;
            --dark-bg: #202124;
            --dark-surface: #303134;
            --dark-text: #e8eaed;
            --dark-text-secondary: #9aa0a6;
            --dark-outline: #5f6368;
            --dark-accent: #8ab4f8;
            --dark-record: #f28b82;
            --bg: var(--dark-bg);
            --surface: var(--dark-surface);
            --text: var(--dark-text);
            --text-secondary: var(--dark-text-secondary);
            --outline: var(--dark-outline);
            --accent: var(--dark-accent);
            --record: var(--dark-record);
        }

        body[data-theme="light"] {
            --bg: var(--light-bg);
            --surface: var(--light-surface);
            --text: var(--light-text);
            --text-secondary: var(--light-text-secondary);
            --outline: var(--light-outline);
            --accent: var(--light-accent);
            --record: var(--light-record);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            touch-action: none;
            transition: background-color .3s, color .3s;
        }

        #main-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            gap: 15px;
        }

        .draggable-section {
            width: 95%;
            max-width: 600px;
            position: relative;
            transition: transform 0.2s ease-out;
        }

        .draggable-section.is-dragging {
            z-index: 1000;
            transition: none;
        }

        .placeholder {
            background: transparent;
        }

        .drag-handle {
            position: absolute;
            background-color: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 8px;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 24px;
            line-height: 10px;
            cursor: grab;
            z-index: 110;
            touch-action: none;
            user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        #canvas-container {
            border: 1px solid var(--outline);
            border-radius: 8px;
            background-color: var(--surface);
            flex-shrink: 0;
        }

        .container-wrapper {
            flex-grow: 1;
            min-height: 0;
            position: relative;
        }

        .container {
            background-color: var(--surface);
            border-radius: 12px;
            padding: 35px;
            border: 1px solid var(--outline);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
            overflow-y: auto;
            transition: background-color .3s, border-color .3s;
            scrollbar-width: none;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        #custom-scrollbar {
            position: absolute;
            top: 10px;
            bottom: 10px;
            right: 5px;
            width: 15px;
        }

        #scrollbar-thumb {
            width: 100%;
            background-color: var(--accent);
            border-radius: 4px;
            position: relative;
            cursor: grab;
        }

        #scrollbar-thumb:active {
            cursor: grabbing;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 500;
        }

        .effect-group h2 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 0;
        }

        .effect-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        #canvas-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            touch-action: none;
        }

        #waveform-canvas {
            width: 100%;
            height: 120px;
            background-color: var(--bg);
            cursor: crosshair;
            display: block;
            touch-action: none;
        }

        .crop-overlay {
            position: absolute;
            top: 0;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        #crop-overlay-start {
            left: 0;
            width: 0;
        }

        #crop-overlay-end {
            right: 0;
            width: 0;
        }

        #play-indicator-v,
        #play-indicator-h {
            position: absolute;
            background-color: var(--record);
            pointer-events: none;
            opacity: 0;
            transition: opacity .1s;
        }

        #play-indicator-v {
            width: 2px;
            height: 120px;
            top: 0;
        }

        #play-indicator-h {
            height: 2px;
            width: 100%;
            left: 0;
        }

        #instructions {
            text-align: center;
            color: var(--text-secondary);
            min-height: 1.2em;
            font-size: .9rem;
            margin: 0;
            padding: 5px;
            border-top: 1px solid var(--outline);
            border-radius: 0 0 8px 8px;
        }

        .effect-controls {
            display: grid;
            gap: 20px 15px;
            padding-top: 10px;
            border-top: 1px solid var(--outline);
            margin-top: 10px;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            justify-items: center;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            touch-action: none;
        }

        .control label {
            font-size: .8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .knob-container {
            position: relative;
            width: 50px;
            height: 50px;
            cursor: ew-resize;
            touch-action: none;
        }

        .knob-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(135deg);
            pointer-events: none;
        }

        .knob-track,
        .knob-fill {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
        }

        .knob-track {
            stroke: var(--outline);
        }

        .knob-fill {
            stroke: var(--accent);
        }

        .square-slider-container {
            width: 40px;
            height: 24px;
            background-color: var(--outline);
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            touch-action: manipulation;
        }

        .square-slider-fill {
            background-color: var(--accent);
            width: 100%;
            height: 100%;
            transform-origin: left;
            transform: scaleX(0);
        }

        .square-slider-container[data-checked=true] .square-slider-fill {
            transform: scaleX(1);
        }

        .bottom-controls {
            flex-shrink: 0;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 15px;
            background-color: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 12px;
        }

        button,
        .file-upload-wrapper label {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--outline);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
            font-weight: 500;
            transition: background-color .2s, border-color .2s;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            touch-action: manipulation;
        }

        .file-upload-wrapper {
            display: flex;
        }

        button:hover,
        .file-upload-wrapper label:hover {
            background-color: var(--outline);
        }

        #record-btn.recording,
        #autoplay-btn.playing {
            background-color: var(--record);
            color: var(--bg);
            border-color: var(--record);
        }

        input[type=file] {
            display: none;
        }

        .autoplay-controls {
            grid-column: 1 / -1;
            display: contents;
        }

        .effect-group.disabled .effect-controls {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>

<body data-theme="dark">

                        <div class="control">

    <script>
        // Multi-touch tracking
        const activeTouches = new Map();
        
        // Initialize Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;
        let granularNode = null;
        let filterNode = null;
        let pannerNode = null;
        let isPlaying = false;
        
        const fileUpload = document.getElementById('audio-upload');
        const canvas = document.getElementById('waveform-canvas');
        const ctx = canvas.getContext('2d');
        const playIndicatorV = document.getElementById('play-indicator-v');
        const playIndicatorH = document.getElementById('play-indicator-h');
        const instructions = document.getElementById('instructions');
        const resetBtn = document.getElementById('reset-btn');
        const recordBtn = document.getElementById('record-btn');
        const autoplayBtn = document.getElementById('autoplay-btn');
        const cropOverlayStart = document.getElementById('crop-overlay-start');
        const cropOverlayEnd = document.getElementById('crop-overlay-end');
        
        let isRecording = false;
        let recorderNode = null;
        let recordedData = [];
        let effects = {};
        
        let autoplayState = {
            isPlaying: false,
            direction: false,
            cropStart: 0,
            cropEnd: 1,
            speed: 1,
            verticalPos: 0.5,
            startTime: 0,
            frameId: null
        };

        // Granular Processor Code
        const granularProcessorCode = `
            class GranularProcessor extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this._buffers = [];
                    this._lastGrainTime = 0;
                    this.grains = [];
                    
                    this._pinkB_L = [0, 0, 0, 0, 0, 0, 0];
                    this._pinkB_R = [0, 0, 0, 0, 0, 0, 0];
                    this._brownLastOut_L = 0;
                    this._brownLastOut_R = 0;

                    this.port.onmessage = (event) => {
                        if (event.data.buffers) {
                            this._buffers = event.data.buffers;
                        }
                    };
                }

                static get parameterDescriptors() {
                    return [
                        { name: 'playing', defaultValue: 0, minValue: 0, maxValue: 1 },
                        { name: 'playhead', defaultValue: 0, minValue: 0, maxValue: 1 },
                        { name: 'grainSize', defaultValue: 100, minValue: 10, maxValue: 500 },
                        { name: 'grainDensity', defaultValue: 20, minValue: 1, maxValue: 100 },
                        { name: 'pitch', defaultValue: 1.0, minValue: 0.1, maxValue: 4.0 },
                        { name: 'pitchJitter', defaultValue: 0, minValue: 0, maxValue: 1 },
                        { name: 'grainJitter', defaultValue: 0, minValue: 0, maxValue: 1000 },
                        { name: 'spread', defaultValue: 0.1, minValue: 0, maxValue: 1 },
                        { name: 'pitchSync', defaultValue: 0, minValue: 0, maxValue: 1 },
                        { name: 'reverseChance', defaultValue: 0, minValue: 0, maxValue: 1 },
                        { name: 'noiseAmount', defaultValue: 0, minValue: 0, maxValue: 1.0 },
                        { name: 'noiseType', defaultValue: 0, minValue: 0, maxValue: 2 }
                    ];
                }

                process(inputs, outputs, parameters) {
                    const output = outputs[0];
                    const channelCount = output.length;
                    if (channelCount < 2) return true;

                    const outputLength = output[0].length;

                    if (parameters.playing[0] < 0.5 || this._buffers.length === 0) {
                        for (let channel = 0; channel < channelCount; channel++) {
                            output[channel].fill(0);
                        }
                        return true;
                    }
                    
                    const grainInterval = 1.0 / parameters.grainDensity[0];

                    if (currentTime > this._lastGrainTime + Math.max(0.001, grainInterval)) {
                        this._lastGrainTime = currentTime;
                        const grainSize = parameters.grainSize[0] / 1000;
                        const grainSizeSamples = Math.round(grainSize * sampleRate);
                        const bufferLength = this._buffers[0].length;
                        
                        const jitterAmount = (Math.random() * 2 - 1) * (parameters.grainJitter[0] / 10000.0) * bufferLength;
                        let startPosition = Math.floor(parameters.playhead[0] * bufferLength + jitterAmount);
                        startPosition = Math.max(0, Math.min(startPosition, bufferLength - grainSizeSamples));
                        
                        const grainBuffers = this._buffers.map(channelBuffer => 
                            channelBuffer.subarray(startPosition, startPosition + grainSizeSamples)
                        );
                        
                        const pitchRand = (Math.random() * 2 - 1) * parameters.pitchJitter[0];
                        const finalPitch = parameters.pitch[0] + pitchRand;
                        const isPitchSynced = parameters.pitchSync[0] > 0.5;

                        let totalDurationSamples;
                        if (isPitchSynced) {
                            totalDurationSamples = grainSizeSamples;
                        } else {
                            totalDurationSamples = Math.floor(grainSizeSamples / finalPitch);
                        }

                        const finalPan = (Math.random() * 2 - 1) * parameters.spread[0];

                        this.grains.push({
                            buffers: grainBuffers,
                            playbackPosition: 0,
                            pitch: finalPitch,
                            totalDurationSamples: totalDurationSamples,
                            pan: finalPan,
                            direction: Math.random() < parameters.reverseChance[0] ? -1 : 1,
                            isPitchSynced: isPitchSynced
                        });
                    }

                    const noiseAmount = parameters.noiseAmount[0];
                    const noiseType = Math.round(parameters.noiseType[0]);

                    for (let i = 0; i < outputLength; i++) {
                        let leftSample = 0;
                        let rightSample = 0;

                        let noiseL = 0;
                        let noiseR = 0;

                        const whiteL = Math.random() * 2 - 1;
                        const whiteR = Math.random() * 2 - 1;

                        if (noiseType === 0) { // White
                            noiseL = whiteL;
                            noiseR = whiteR;
                        } else if (noiseType === 1) { // Pink
                            this._pinkB_L[0] = 0.99886 * this._pinkB_L[0] + whiteL * 0.0555179;
                            this._pinkB_L[1] = 0.99332 * this._pinkB_L[1] + whiteL * 0.0750759;
                            this._pinkB_L[2] = 0.96900 * this._pinkB_L[2] + whiteL * 0.1538520;
                            this._pinkB_L[3] = 0.86650 * this._pinkB_L[3] + whiteL * 0.3104856;
                            this._pinkB_L[4] = 0.55000 * this._pinkB_L[4] + whiteL * 0.5329522;
                            this._pinkB_L[5] = -0.7616 * this._pinkB_L[5] - whiteL * 0.0168980;
                            noiseL = this._pinkB_L[0] + this._pinkB_L[1] + this._pinkB_L[2] + this._pinkB_L[3] + this._pinkB_L[4] + this._pinkB_L[5] + this._pinkB_L[6] + whiteL * 0.5362;
                            this._pinkB_L[6] = whiteL * 0.115926;
                            noiseL /= 5.0;

                            this._pinkB_R[0] = 0.99886 * this._pinkB_R[0] + whiteR * 0.0555179;
                            this._pinkB_R[1] = 0.99332 * this._pinkB_R[1] + whiteR * 0.0750759;
                            this._pinkB_R[2] = 0.96900 * this._pinkB_R[2] + whiteR * 0.1538520;
                            this._pinkB_R[3] = 0.86650 * this._pinkB_R[3] + whiteR * 0.3104856;
                            this._pinkB_R[4] = 0.55000 * this._pinkB_R[4] + whiteR * 0.5329522;
                            this._pinkB_R[5] = -0.7616 * this._pinkB_R[5] - whiteR * 0.0168980;
                            noiseR = this._pinkB_R[0] + this._pinkB_R[1] + this._pinkB_R[2] + this._pinkB_R[3] + this._pinkB_R[4] + this._pinkB_R[5] + this._pinkB_R[6] + whiteR * 0.5362;
                            this._pinkB_R[6] = whiteR * 0.115926;
                            noiseR /= 5.0;
                        } else { // Brown
                            this._brownLastOut_L = (this._brownLastOut_L + (0.02 * whiteL)) / 1.02;
                            this._brownLastOut_R = (this._brownLastOut_R + (0.02 * whiteR)) / 1.02;
                            noiseL = this._brownLastOut_L * 3.5;
                            noiseR = this._brownLastOut_R * 3.5;
                        }

                        for (const grain of this.grains) {
                            const progress = grain.playbackPosition / grain.totalDurationSamples;
                            if (progress >= 0 && progress < 1) {
                                const envelope = 1 - Math.abs(2 * progress - 1);
                                
                                let readPosition;
                                if (grain.direction === 1) {
                                    readPosition = Math.floor(grain.playbackPosition * grain.pitch);
                                } else {
                                    readPosition = Math.floor((grain.totalDurationSamples - grain.playbackPosition) * grain.pitch);
                                }

                                if (grain.isPitchSynced && grain.buffers[0].length > 0) {
                                    readPosition = readPosition % grain.buffers[0].length;
                                }

                                if (readPosition >= 0 && readPosition < grain.buffers[0].length) {
                                    const isStereo = grain.buffers.length > 1 && grain.buffers[1].length > readPosition;
                                    
                                    const rawSampleL = grain.buffers[0][readPosition];
                                    const rawSampleR = isStereo ? grain.buffers[1][readPosition] : rawSampleL;

                                    const modulatedNoiseL = noiseL * noiseAmount * Math.abs(rawSampleL);
                                    const modulatedNoiseR = noiseR * noiseAmount * Math.abs(rawSampleR);

                                    const grainSampleL = (rawSampleL + modulatedNoiseL) * envelope;
                                    const grainSampleR = (rawSampleR + modulatedNoiseR) * envelope;

                                    let pannedL = grainSampleL;
                                    let pannedR = grainSampleR;
                                    const panVal = grain.pan;

                                    if (panVal > 0) {
                                        pannedL *= (1.0 - panVal);
                                    } else {
                                        pannedR *= (1.0 + panVal);
                                    }

                                    leftSample += pannedL;
                                    rightSample += pannedR;
                                }
                            }
                        }
                        output[0][i] = leftSample;
                        output[1][i] = rightSample;

                        for (let g = this.grains.length - 1; g >= 0; g--) {
                            const grain = this.grains[g];
                            grain.playbackPosition += 1;
                            if (grain.playbackPosition >= grain.totalDurationSamples) {
                                this.grains.splice(g, 1);
                            }
                        }
                    }
                    return true;
                }
            }
            registerProcessor('granular-processor', GranularProcessor);
        `;

        // Setup Audio Chain
        async function setupAudioChain() {
            try {
                const blob = new Blob([granularProcessorCode], { type: 'application/javascript' });
                const workletURL = URL.createObjectURL(blob);
                await audioContext.audioWorklet.addModule(workletURL);
                
                granularNode = new AudioWorkletNode(audioContext, 'granular-processor', {
                    outputChannelCount: [2]
                });
                
                effects.inputGain = audioContext.createGain();
                filterNode = audioContext.createBiquadFilter();
                pannerNode = audioContext.createStereoPanner();
                
                effects.inputGain.connect(filterNode);
                filterNode.connect(pannerNode);
                pannerNode.connect(audioContext.destination);
                granularNode.connect(effects.inputGain);
                
                instructions.textContent = 'Ready! Upload an audio file.';
            } catch (e) {
                console.error('Audio setup failed:', e);
                instructions.textContent = 'Audio setup failed. Please refresh.';
            }
        }

        setupAudioChain();

        // Load Audio File
        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                const channels = [];
                for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                    channels.push(audioBuffer.getChannelData(i));
                }
                granularNode.port.postMessage({ buffers: channels });
                
                drawWaveform(audioBuffer);
                instructions.textContent = 'Loaded: ' + file.name;
            } catch (e) {
                console.error('Failed to load audio:', e);
                instructions.textContent = 'Failed to load audio file.';
            }
        });

        // Draw Waveform
        function drawWaveform(buffer) {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const width = canvas.width;
            const height = canvas.height;
            ctx.fillStyle = getComputedStyle(canvas).backgroundColor;
            ctx.fillRect(0, 0, width, height);

            const data = buffer.getChannelData(0);
            const step = Math.ceil(data.length / width);
            const amp = height / 2;

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
            ctx.lineWidth = 1;
            ctx.beginPath();

            for (let i = 0; i < width; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[i * step + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                ctx.lineTo(i, amp - max * amp);
            }
            ctx.stroke();
        }

        // Knob Rendering
        function renderKnob(container) {
            const min = parseFloat(container.dataset.min);
            const max = parseFloat(container.dataset.max);
            const value = parseFloat(container.dataset.value);
            
            const normalizedValue = (value - min) / (max - min);
            const startAngle = Math.PI * 0.75;
            const endAngle = Math.PI * 2.25;

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 100 100');

            const track = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            track.setAttribute('cx', '50');
            track.setAttribute('cy', '50');
            track.setAttribute('r', '40');
            track.classList.add('knob-track');

            const fill = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            fill.setAttribute('cx', '50');
            fill.setAttribute('cy', '50');
            fill.setAttribute('r', '40');
            fill.classList.add('knob-fill');
            fill.setAttribute('stroke-dasharray', `${(endAngle - startAngle) * 40} ${Math.PI * 80}`);
            fill.setAttribute('stroke-dashoffset', `${(1 - normalizedValue) * (endAngle - startAngle) * 40}`);

            svg.appendChild(track);
            svg.appendChild(fill);
            container.innerHTML = '';
            container.appendChild(svg);
        }

        // Initialize all knobs and controls
        document.querySelectorAll('.knob-container').forEach(container => {
            renderKnob(container);
            container.addEventListener('pointerdown', handleKnobStart);
            container.addEventListener('touchstart', handleKnobStart, { passive: false });
        });

        // Knob Start Handler - Multi-touch support
        function handleKnobStart(e) {
            e.preventDefault();
            const container = e.currentTarget;
            const pointerId = e.pointerId !== undefined ? e.pointerId : 'touch-' + (e.touches ? e.touches[0].identifier : 0);
            
            const min = parseFloat(container.dataset.min);
            const max = parseFloat(container.dataset.max);
            const step = parseFloat(container.dataset.step) || (max - min) / 100;
            let currentValue = parseFloat(container.dataset.value);
            const startX = e.clientX || e.touches[0].clientX;
            const startY = e.clientY || e.touches[0].clientY;

            activeTouches.set(pointerId, {
                type: 'knob',
                container,
                min, max, step,
                startValue: currentValue,
                startX, startY
            });

            function onMove(moveEvent) {
                const touch = activeTouches.get(pointerId);
                if (!touch) return;

                const clientX = moveEvent.clientX || moveEvent.touches?.[0]?.clientX;
                const clientY = moveEvent.clientY || moveEvent.touches?.[0]?.clientY;
                
                if (!clientX) return;

                const deltaX = clientX - touch.startX;
                const deltaY = moveEvent.clientY || moveEvent.touches?.[0]?.clientY - touch.startY;
                
                // X: horizontal fine control, Y: vertical coarse control
                const delta = Math.abs(deltaX) > Math.abs(deltaY) ? deltaX : deltaY * 2;
                currentValue = Math.max(touch.min, Math.min(touch.max, touch.startValue + (delta / 100) * touch.step));
                
                container.dataset.value = currentValue;
                renderKnob(container);
                updateAudioParameter(container.dataset.id, currentValue);
            }

            function onEnd() {
                activeTouches.delete(pointerId);
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('pointerup', onEnd);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('pointermove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('pointerup', onEnd);
            document.addEventListener('touchend', onEnd);
        }

        // Update Audio Parameters
        function updateAudioParameter(id, value) {
            if (!granularNode) return;

            const paramMapping = {
                'input-gain': { param: 'none', fn: () => effects.inputGain.gain.value = value },
                'preview-filter-type': { param: 'none', fn: () => filterNode.type = ['lowpass', 'highpass', 'bandpass', 'lowshelf', 'highshelf', 'peaking', 'notch', 'allpass'][Math.floor(value)] },
                'preview-filter-q': { param: 'none', fn: () => filterNode.Q.value = value },
                'grain-size': { param: 'grainSize' },
                'grain-density': { param: 'grainDensity' },
                'pitch': { param: 'pitch' },
                'pitch-jitter': { param: 'pitchJitter' },
                'grain-jitter': { param: 'grainJitter' },
                'spread': { param: 'spread' },
                'pan': { param: 'none', fn: () => pannerNode.pan.value = value },
                'reverse-chance': { param: 'reverseChance' },
                'noise-amount': { param: 'noiseAmount' },
                'noise-type': { param: 'noiseType' },
                'pitch-sync': { param: 'pitchSync' },
                'autoplay-crop-start': { param: 'none', fn: () => { autoplayState.cropStart = value; cropOverlayStart.style.width = (value * 100) + '%'; } },
                'autoplay-crop-end': { param: 'none', fn: () => { autoplayState.cropEnd = value; cropOverlayEnd.style.width = ((1 - value) * 100) + '%'; } },
                'autoplay-speed': { param: 'none', fn: () => autoplayState.speed = value },
                'autoplay-vertical-pos': { param: 'none', fn: () => autoplayState.verticalPos = value }
            };

            const mapping = paramMapping[id];
            if (mapping) {
                if (mapping.param && granularNode.parameters.has(mapping.param)) {
                    granularNode.parameters.get(mapping.param).value = value;
                }
                if (mapping.fn) mapping.fn();
            }
        }

        // Square Slider Handler - Multi-touch support
        document.querySelectorAll('.square-slider-container').forEach(slider => {
            slider.addEventListener('pointerdown', handleSliderClick);
            slider.addEventListener('touchstart', handleSliderClick, { passive: false });
        });

        function handleSliderClick(e) {
            e.preventDefault();
            const slider = e.currentTarget;
            const checked = slider.dataset.checked === 'true';
            slider.dataset.checked = !checked;
            
            if (slider.dataset.id === 'theme-toggle') {
                const theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
                document.body.dataset.theme = theme;
            }
            
            const groupToggle = slider.closest('.effect-group');
            if (groupToggle && slider.classList.contains('group-toggle')) {
                const controls = groupToggle.querySelector('.effect-controls');
                controls.style.display = checked ? 'none' : 'grid';
            }
        }

        // Canvas X-Y interaction
        canvas.addEventListener('pointerdown', handleCanvasStart);
        canvas.addEventListener('touchstart', handleCanvasStart, { passive: false });

        function handleCanvasStart(e) {
            e.preventDefault();
            if (!audioBuffer || !granularNode) return;

            const pointerId = e.pointerId !== undefined ? e.pointerId : 'canvas-' + (e.touches ? e.touches[0].identifier : 0);
            const rect = canvas.getBoundingClientRect();
            const startX = (e.clientX || e.touches[0].clientX) - rect.left;
            const startY = (e.clientY || e.touches[0].clientY) - rect.top;

            activeTouches.set(pointerId, {
                type: 'canvas',
                startX, startY,
                rect
            });

            function onMove(moveEvent) {
                const touch = activeTouches.get(pointerId);
                if (!touch) return;

                const clientX = moveEvent.clientX || moveEvent.touches?.[0]?.clientX;
                const clientY = moveEvent.clientY || moveEvent.touches?.[0]?.clientY;
                
                if (!clientX) return;

                const x = (clientX - touch.rect.left) / touch.rect.width;
                const y = (clientY - touch.rect.top) / touch.rect.height;
                
                const playhead = Math.max(0, Math.min(1, x));
                const verticalPos = Math.max(0, Math.min(1, y));
                
                if (granularNode.parameters.has('playhead')) {
                    granularNode.parameters.get('playhead').value = playhead;
                }
                playIndicatorV.style.left = (playhead * 100) + '%';
                playIndicatorH.style.top = (verticalPos * 100) + '%';
            }

            function onEnd() {
                activeTouches.delete(pointerId);
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('pointerup', onEnd);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('pointermove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('pointerup', onEnd);
            document.addEventListener('touchend', onEnd);
        }

        // Draggable Section Handler - Multi-touch support
        document.querySelectorAll('.drag-handle').forEach(handle => {
            handle.addEventListener('pointerdown', handleDragStart);
            handle.addEventListener('touchstart', handleDragStart, { passive: false });
        });

        function handleDragStart(e) {
            e.preventDefault();
            const handle = e.currentTarget;
            const section = handle.closest('.draggable-section');
            const pointerId = e.pointerId !== undefined ? e.pointerId : 'drag-' + (e.touches ? e.touches[0].identifier : 0);
            
            const startX = e.clientX || e.touches[0].clientX;
            const startY = e.clientY || e.touches[0].clientY;
            let currentX = parseFloat(section.style.transform.match(/translateX\((.+)px\)/) ? section.style.transform.match(/translateX\((.+)px\)/)[1] : 0);
            let currentY = parseFloat(section.style.transform.match(/translateY\((.+)px\)/) ? section.style.transform.match(/translateY\((.+)px\)/)[1] : 0);

            section.classList.add('is-dragging');
            activeTouches.set(pointerId, { type: 'drag', section, startX, startY, currentX, currentY });

            function onMove(moveEvent) {
                const touch = activeTouches.get(pointerId);
                if (!touch) return;

                const clientX = moveEvent.clientX || moveEvent.touches?.[0]?.clientX;
                const clientY = moveEvent.clientY || moveEvent.touches?.[0]?.clientY;
                
                if (!clientX) return;

                const deltaX = clientX - touch.startX;
                const deltaY = clientY - touch.startY;

                touch.section.style.transform = `translate(${touch.currentX + deltaX}px, ${touch.currentY + deltaY}px)`;
            }

            function onEnd() {
                const touch = activeTouches.get(pointerId);
                if (touch) {
                    touch.section.classList.remove('is-dragging');
                    activeTouches.delete(pointerId);
                }
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('pointerup', onEnd);
                document.removeEventListener('touchend', onEnd);
            }

            document.addEventListener('pointermove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('pointerup', onEnd);
            document.addEventListener('touchend', onEnd);
        }

        // Play/Stop Controls
        let currentSource = null;
        autoplayBtn.addEventListener('click', () => {
            if (autoplayState.isPlaying) {
                stopAutoplay();
            } else if (audioBuffer) {
                startAutoplay();
            }
        });

        function startAutoplay() {
            if (!audioBuffer || !granularNode) return;
            
            autoplayState.isPlaying = true;
            autoplayBtn.classList.add('playing');
            
            if (currentSource) currentSource.stop();
            currentSource = audioContext.createBufferSource();
            currentSource.buffer = audioBuffer;
            currentSource.connect(effects.inputGain);
            
            const cropStart = autoplayState.cropStart * audioBuffer.duration;
            const cropEnd = autoplayState.cropEnd * audioBuffer.duration;
            currentSource.start(audioContext.currentTime, cropStart, cropEnd - cropStart);
        }

        function stopAutoplay() {
            autoplayState.isPlaying = false;
            autoplayBtn.classList.remove('playing');
            if (currentSource) {
                currentSource.stop();
                currentSource = null;
            }
        }

        // Reset Button
        resetBtn.addEventListener('click', () => {
            document.querySelectorAll('[data-id]').forEach(el => {
                if (el.dataset.defaultChecked !== undefined) {
                    el.dataset.checked = el.dataset.defaultChecked;
                } else if (el.dataset.value !== undefined) {
                    el.dataset.value = parseFloat(el.dataset.value);
                    if (el.classList.contains('knob-container')) {
                        renderKnob(el);
                        updateAudioParameter(el.dataset.id, parseFloat(el.dataset.value));
                    }
                }
            });
        });

        // Record Button
        recordBtn.addEventListener('click', async () => {
            if (!isRecording && audioContext.state === 'running') {
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.textContent = 'Recording...';
            } else if (isRecording) {
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.textContent = 'Record';
            }
        });

        // Info Button
        document.getElementById('info-btn').addEventListener('click', () => {
            alert('migrain - Granular Synthesizer\n\nFeatures:\n- Upload audio files\n- Granular synthesis with adjustable parameters\n- Real-time audio processing\n- Light/Dark theme\n- Multi-touch support\n\nNo external dependencies.');
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (audioBuffer) {
                drawWaveform(audioBuffer);
            }
        });
    </script>
</body>
